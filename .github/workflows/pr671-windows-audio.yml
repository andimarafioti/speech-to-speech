name: PR 671 Windows audio probe

# Throwaway probe for huggingface/speech-to-speech#671 (client echo cancellation).
# A VB-CABLE virtual loopback stands in for speaker->microphone: nothing is audible.
on:
  push:
    branches: [probe/pr-671-windows-audio]
  workflow_dispatch:

permissions:
  contents: read

env:
  PR_SHA: 90e30e266eacf862eefc29fd32d4855717d74297

jobs:
  loopback:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huggingface/speech-to-speech
          ref: ${{ env.PR_SHA }}
          path: s2s
      - name: Install VB-CABLE virtual loopback
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c
      - name: Allow microphone access and start the audio service
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" -Name "LetAppsAccessMicrophone" -Value 1 -PropertyType DWord -Force | Out-Null
          Set-Service -Name audiosrv -StartupType Automatic
          Start-Service -Name audiosrv
          Get-Service audiosrv, AudioEndpointBuilder
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: python -m pip install numpy scipy sounddevice "pywebrtc-audio>=0.2.0,<0.3" openai jsonschema
      - name: List audio devices
        run: python -m sounddevice
      - name: Probe MME, DirectSound and WASAPI
        shell: pwsh
        run: |
          python probe/loopback_probe.py --src s2s/src --out "VB-Audio Virtual Cabl" --in "CABLE Output" `
            --hostapi MME --hostapi DirectSound --hostapi WASAPI 2>&1 | Tee-Object -FilePath probe-results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-results
          path: probe-results.jsonl

  client-tests:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huggingface/speech-to-speech
          ref: ${{ env.PR_SHA }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
      - run: uv sync --group dev --python 3.11
      - name: Audio client and CLI tests (includes the spawned audio worker)
        run: uv run pytest tests/openai_realtime/test_audio_client.py tests/test_cli_defaults.py -q
